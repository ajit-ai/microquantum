[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microquantum"
dynamic = ["version"]
description = "A lightweight, NumPy-only quantum computing SDK foundation: circuits, problems, algorithms, a pluggable execution runtime, backends, experiments and analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ajit Kumar"},
]
keywords = [
    "quantum",
    "quantum-computing",
    "quantum-circuit",
    "simulator",
    "qiskit-alternative",
    "vqe",
    "qaoa",
    "grover",
    "shor",
    "qml",
    "qec",
    "qubo",
    "optimization",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.8.0",
    "furo>=2024.8.6",
]
gpu = [
    "cupy-cuda12x>=12.0",
]
all = [
    "cupy-cuda12x>=12.0",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.8.0",
    "furo>=2024.8.6",
]

[project.urls]
Homepage = "https://github.com/ajit-ai/microquantum"
Repository = "https://github.com/ajit-ai/microquantum"
Documentation = "https://ajit-ai.github.io/microquantum/"
Issues = "https://github.com/ajit-ai/microquantum/issues"
Changelog = "https://github.com/ajit-ai/microquantum/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "microquantum.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=microquantum --cov-report=term-missing"

[tool.coverage.run]
source = ["microquantum"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["microquantum.core.circuit", "microquantum.core.gradient"]
disable_error_code = ["assignment", "arg-type", "misc", "union-attr", "index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.0",
    "mypy>=1.0",
    "ruff>=0.9",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.8.0",
    "furo>=2024.8.6",
]
