name: Upload Python Package to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-dists
          path: dist/

      - name: Sanity-check installed wheel
        run: |
          uv run --with dist/microquantum-*.whl python -c "import microquantum; print(microquantum.__version__)"

  testpypi-publish:
    runs-on: ubuntu-latest
    needs:
      - test-build
    permissions:
      id-token: write

    environment:
      name: microquantum
      url: https://test.pypi.org/project/microquantum/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-dists
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
